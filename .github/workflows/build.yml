name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: STM32F767
            project: stm32f767
          - chip: STM32H755
            project: stm32h755
    steps:
      - uses: actions/checkout@v4

      # Same toolchain version as local dev (Arm GNU Toolchain 15.2.rel1)
      - name: Cache Arm GNU Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/arm-toolchain
          key: arm-gnu-toolchain-15.2.rel1-linux-x64

      - name: Download Arm GNU Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/arm-toolchain
          curl -sL "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz" \
            | tar -xJ -C ~/arm-toolchain --strip-components=1

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -G Ninja -S projects/${{ matrix.project }} -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DSTM32_TOOLCHAIN_PATH=$HOME/arm-toolchain

      # All targets: STM32H755 also builds the Cortex-M4 image STM32H755_CM4
      - name: Build
        run: cmake --build build

      - name: Firmware size
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          ~/arm-toolchain/bin/arm-none-eabi-size $(ls build/${{ matrix.chip }} build/${{ matrix.chip }}_CM4 2>/dev/null) | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}
          path: |
            build/${{ matrix.chip }}
            build/${{ matrix.chip }}.bin
            build/${{ matrix.chip }}_CM4
            build/${{ matrix.chip }}_CM4.bin
          if-no-files-found: warn

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # tests/vda/validate.py checks VDA 5050 messages against the official schemas
      - name: Install jsonschema
        run: python3 -m pip install --user jsonschema

      - name: Configure
        run: cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-tests

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure
