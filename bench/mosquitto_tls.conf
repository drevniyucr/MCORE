# Mosquitto for the MQTT/TLS bench (run from the repository root):
#   python bench/tls/make_bench_certs.py     (once: CA, broker and client certificates)
#   mosquitto -c bench/mosquitto_tls.conf -v
#
# 8883 on the board network: TLS 1.2 only, a client certificate from the bench
#      CA is required and its CN becomes the user name.
# 1883 on localhost only, without authentication: mosquitto_sub/_pub on this PC,
#      e.g.  mosquitto_sub -h 127.0.0.1 -t "mcore/#" -v
#            mosquitto_pub -h 127.0.0.1 -t mcore/mcore-01/cmd -m ping
persistence false
log_type error
log_type warning
log_type notice

listener 8883 0.0.0.0
cafile bench/tls/out/ca.crt
certfile bench/tls/out/broker.crt
keyfile bench/tls/out/broker.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
allow_anonymous false

listener 1883 127.0.0.1
allow_anonymous true
