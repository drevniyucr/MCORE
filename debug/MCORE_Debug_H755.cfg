# NUCLEO-H755ZI-Q (STM32H755ZITx), Cortex-M7 core - MCORE debug/flash config.
# Needs OpenOCD >= 0.12 (target/stm32h7x*.cfg ship with it).
#
#   openocd -s debug/openocd -f debug/MCORE_Debug_H755.cfg
#
# Both cores are exposed: Cortex-M7 on GDB port 3333 (real-time image,
# flash bank 1), Cortex-M4 on port 3334 (network image, flash bank 2).
# Flash both images:
#   openocd -s debug/openocd -f debug/MCORE_Debug_H755.cfg #     -c "program build-h7/STM32H755.bin 0x08000000 verify" #     -c "program build-h7/STM32H755_CM4.bin 0x08100000 verify reset exit"

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

set CHIPNAME stm32h7x
set DUAL_CORE 1
set USE_CTI 0

# 2 MB device: bank 1 (0x08000000, CM7 image) + bank 2 (0x08100000, CM4 image)
source [find target/stm32h7x_dual_bank.cfg]

# The H7 does not support connect-under-reset in this script (AXI is unavailable
# while SRST is held); use BOOT0=1 to recover a chip stuck by a bad image or a
# wrong power-supply setting (see MCORE_PWR_SUPPLY in app/config.hpp).
reset_config srst_only srst_nogate

gdb_port 3333
